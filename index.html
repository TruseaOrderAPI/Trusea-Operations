<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TruSea Ops</title>
<style>
:root{--navy:#0b2545;--teal:#13a89e;--teal-d:#0e857d;--bg:#f4f6f8;--line:#dfe5ec;--mute:#667585;--red:#c0392b;--amber:#b7791f;--green:#1e8449}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:#1b2733}
.top{background:var(--navy);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.top b{font-size:17px}.top small{display:block;color:#b9c6d8}
.wrap{max-width:900px;margin:0 auto;padding:12px}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{flex:1;min-width:80px;padding:13px 8px;border:0;background:none;font:inherit;color:var(--mute);border-bottom:3px solid transparent}
.tabs button.on{color:var(--navy);font-weight:600;border-bottom-color:var(--teal)}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 8px;color:var(--navy)}
button,input,select,textarea{font:inherit}
.btn{min-height:48px;padding:10px 16px;border:0;border-radius:8px;background:var(--teal);color:#fff;width:100%;margin-top:8px}
.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.red{background:var(--red)}.btn.sm{width:auto;min-height:40px;margin-top:0;padding:6px 12px}
.btn:disabled{opacity:.5}
input,select,textarea{width:100%;min-height:46px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}
.mute{color:var(--mute);font-size:14px}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:13px;font-weight:600;background:#eee;color:#555}
.b-Pending,.b-Failed,.b-NONE{background:#fde8e6;color:var(--red)}.b-Assigned{background:#e6eefb;color:#2b5aa8}
.b-Out{background:#d9f0ee;color:var(--teal-d)}.b-Delivered,.b-IN{background:#e3f4ea;color:var(--green)}.b-late{background:#fff1d6;color:var(--amber)}
.msg{position:sticky;top:0;z-index:5;padding:10px 12px;border-radius:8px;margin-bottom:10px;background:#e3f4ea;color:var(--green)}
.msg.err{background:#fde8e6;color:var(--red)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}.kpi b{display:block;font-size:22px;color:var(--navy)}.kpi small{color:var(--mute)}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--mute);font-size:12px;text-transform:uppercase}
.gate{padding:40px 20px;text-align:center}.gate h2{font-size:20px}
.dlg{position:fixed;inset:0;background:rgba(11,37,69,.5);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.dlg>div{background:#fff;border-radius:12px;padding:16px;width:100%;max-width:420px}
.items{margin:6px 0;padding-left:18px}
a{color:var(--teal-d)}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* TruSea Ops - frontend (ONE file). Paste your Apps Script Web App URL below.
   Nothing is stored in the browser: all data lives in the Google Sheet (source of truth).
   The login token is kept only in memory, so reloading the page asks for the PIN again. */
const API_URL = 'https://script.google.com/macros/s/AKfycbwIQVYLO8U5Dm-9fbHWmRKBmDGyfi0oqtpH4gvKOJZF74i8NO3_IPurks_AwOP-jbc/exec';

const S = { token: null, user: null, cfg: { intervalSec: 60 }, att: { state: 'NONE' }, loc: { ok: null, msg: '' },
  staffList: null, tab: 'today', busy: false, msg: null, date: '', month: '', orders: null, noDate: 0, team: null,
  report: null, myMonth: null, filter: 'ALL', loading: false, error: '' };

const $ = s => document.querySelector(s);
const h = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ist = () => new Date(Date.now() + 19800000).toISOString();
const today = () => ist().slice(0, 10);
const tm = s => s ? String(s).slice(11, 16) : '-';
const dm = s => s ? String(s).slice(8, 10) + '-' + String(s).slice(5, 7) : '-';
const mapLink = (a, b) => (a === '' || a == null) ? '-' : '<a target="_blank" rel="noopener" href="https://www.google.com/maps?q=' + a + ',' + b + '">map</a>';

/* ---------- API ---------- */
async function api(action, data) {
  const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action: action, token: S.token }, data || {})) });
  const j = await res.json();
  if (!j.ok) {
    if (j.code === 'AUTH') { S.token = null; S.user = null; S.msg = { t: j.error, err: true }; render(); }
    throw new Error(j.error || 'Request failed');
  }
  return j;
}
function toast(t, err) { S.msg = { t: t, err: !!err }; render(); setTimeout(() => { if (S.msg && S.msg.t === t) { S.msg = null; render(); } }, 6000); }
async function run(fn, okText) {
  if (S.busy) return;
  S.busy = true; render();
  try { await fn(); if (okText) toast(okText); } catch (e) { toast(e.message, true); }
  S.busy = false;
  try { await refresh(); } catch (e) { S.error = e.message; render(); }
}

/* ---------- location (app works only while phone location is ON) ---------- */
function getPos(o) {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej({ code: 0 });
    navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }), rej,
      Object.assign({ enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }, o || {}));
  });
}
function locMsg(e) {
  return ({ 0: 'This browser does not support location.', 1: 'Location permission is blocked. Allow location for this site in the browser settings.',
    2: 'Phone location (GPS) is OFF. Turn it ON.', 3: 'Could not get your location in time. Check GPS signal and retry.' })[e && e.code] || 'Could not get location.';
}
async function checkLoc() {
  const was = S.loc.ok;
  try { await getPos({ enableHighAccuracy: false, maximumAge: 30000 }); S.loc = { ok: true, msg: '' }; }
  catch (e) { S.loc = { ok: false, msg: locMsg(e) }; }
  if (was !== S.loc.ok) { render(); if (S.loc.ok && S.user) refresh().catch(() => {}); }
}
async function tick() {   // every interval: re-check location; send position while a delivery staff is checked in
  if (!S.user) return checkLoc();
  if (S.user.canDeliver && S.att.state === 'IN') {
    try {
      const p = await getPos();
      if (!S.loc.ok) { S.loc = { ok: true, msg: '' }; render(); }
      await api('ping', p);
    } catch (e) { if (e.code !== undefined) { S.loc = { ok: false, msg: locMsg(e) }; render(); } }
  } else await checkLoc();
}
let timer = null;
function startTimer() { clearInterval(timer); timer = setInterval(tick, Math.max(30, S.cfg.intervalSec || 60) * 1000); }

/* ---------- dialogs ---------- */
function dialog(title, body, withInput, okText) {
  return new Promise(res => {
    const d = document.createElement('div'); d.className = 'dlg';
    d.innerHTML = '<div><h2>' + h(title) + '</h2><p class="mute">' + body + '</p>' + (withInput ? '<textarea rows="3" id="dlgIn"></textarea>' : '') +
      '<button class="btn" id="dlgOk">' + h(okText || 'OK') + '</button>' + (withInput ? '<button class="btn sec" id="dlgNo">Cancel</button>' : '') + '</div>';
    document.body.appendChild(d);
    const done = v => { d.remove(); res(v); };
    d.querySelector('#dlgOk').onclick = () => done(withInput ? d.querySelector('#dlgIn').value.trim() : true);
    if (withInput) d.querySelector('#dlgNo').onclick = () => done(null);
  });
}

/* ---------- data ---------- */
async function refresh() {
  if (!S.user || !S.loc.ok) return;
  S.error = '';
  const me = await api('me'); S.att = me.att; S.cfg = me.cfg;
  if (S.user.manager) {
    if (S.tab === 'deliveries' || S.tab === 'today') { const o = await api('orders', { date: S.date || today() }); S.orders = o.orders; S.noDate = o.noDate; }
    if (S.tab !== 'reports') S.team = (await api('team')).staff;
    if (S.tab === 'reports') S.report = (await api('report', { month: S.month || today().slice(0, 7) })).report;
  } else {
    if (S.user.canDeliver) { const o = await api('orders', { date: today() }); S.orders = o.orders; }
    S.myMonth = (await api('myMonth', { month: today().slice(0, 7) })).rows;
  }
  render();
}

async function doLogin() {
  const id = $('#lid').value, pin = $('#lpin').value;
  if (!id || !pin) return toast('Choose your name and enter PIN', true);
  S.busy = true; render();
  try {
    const j = await api('login', { staffId: id, pin: pin });
    S.token = j.token; S.user = j.user; S.cfg = j.cfg; S.tab = 'today'; S.msg = null; S.date = today(); S.month = today().slice(0, 7);
    startTimer();
  } catch (e) { S.msg = { t: e.message, err: true }; }
  S.busy = false; render();
  if (S.user) { try { await refresh(); } catch (e) { S.error = e.message; render(); } }
}
function logout() { api('logout').catch(() => {}); S.token = null; S.user = null; S.orders = S.team = S.report = null; S.msg = null; render(); }

async function attendanceAction(kind) {
  await run(async () => { const p = await getPos(); await api(kind, p); }, kind === 'checkIn' ? 'Checked in' : 'Checked out');
}

async function setStatus(id, status) {
  let reason = '';
  if (status === 'Failed' || status === 'Cancelled' || S.user.manager) {
    reason = await dialog(status === 'Failed' ? 'Why was delivery not completed?' : 'Reason for ' + status, S.user.manager ? 'Required for failures, cancellations and out-of-flow changes.' : 'Required.', true, 'Save');
    if (reason === null) return;
  }
  await run(async () => {
    let p = {}; if (status === 'Delivered') { try { p = await getPos(); } catch (e) {} }
    await api('setStatus', { orderId: id, status: status, reason: reason, lat: p.lat, lng: p.lng, acc: p.acc });
  }, id + ': ' + status);
}
async function assign(id, staffId) { await run(() => api('assign', { orderId: id, staffId: staffId }), id + ' updated'); }

/* ---------- views ---------- */
function navUrl(o) {
  const m = String(o.map || '').match(/https?:\/\/\S+/) || String(o.address || '').match(/https?:\/\/\S+/);
  if (m) return m[0];
  const a = String(o.address || '').trim();
  return a && a.toLowerCase() !== 'home' ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(a) : '';
}
function attCard() {
  const a = S.att, st = a.state;
  return '<div class="card"><h2>My attendance</h2><div>' + (st === 'IN' ? '<span class="badge b-IN">Checked in ' + tm(a.inTime) + '</span>' :
    st === 'OUT' ? '<span class="badge">Checked out ' + tm(a.outTime) + '</span>' : '<span class="badge b-NONE">Not checked in</span>') + '</div>' +
    (st === 'IN' ? '<button class="btn red" data-a="out"' + (S.busy ? ' disabled' : '') + '>Check out</button>' :
      '<button class="btn" data-a="in"' + (S.busy ? ' disabled' : '') + '>' + (st === 'OUT' ? 'Check in again' : 'Check in') + '</button>') +
    (S.user.canDeliver && st === 'IN' ? '<div class="mute" style="margin-top:6px">Location is shared every ' + (S.cfg.intervalSec || 60) + ' s while checked in. Keep this page open.</div>' : '') + '</div>';
}
function orderCard(o) {
  const mgr = S.user.manager, mine = o.assignedTo === S.user.id, nav = navUrl(o);
  const items = String(o.product).split('|').map(x => x.trim()).filter(Boolean);
  const cod = String(o.pay).toLowerCase() === 'cod' && String(o.paid).toLowerCase() !== 'paid';
  const sc = o.status === 'Out for Delivery' ? 'Out' : o.status;
  let btns = '';
  if (mine && o.status === 'Assigned') btns += '<button class="btn" data-a="st" data-id="' + h(o.id) + '" data-s="Out for Delivery">Start delivery</button>';
  if (mine && o.status === 'Out for Delivery') btns += '<div class="row"><button class="btn" data-a="st" data-id="' + h(o.id) + '" data-s="Delivered">Delivered</button><button class="btn red" data-a="st" data-id="' + h(o.id) + '" data-s="Failed">Failed</button></div>';
  if (mgr && o.status !== 'Delivered' && o.status !== 'Cancelled') {
    const riders = (S.team || []).filter(t => t.canDeliver);
    btns += '<div class="row" style="margin-top:8px"><select data-a="asg" data-id="' + h(o.id) + '"><option value="">Assign rider...</option>' + riders.map(t => '<option value="' + h(t.id) + '"' + (t.id === o.assignedTo ? ' selected' : '') + '>' + h(t.name) + '</option>').join('') + '<option value="-">Unassign</option></select>' +
      '<select data-a="ovr" data-id="' + h(o.id) + '"><option value="">Set status...</option>' + ['Out for Delivery', 'Delivered', 'Failed', 'Cancelled'].filter(x => x !== o.status).map(x => '<option>' + x + '</option>').join('') + '</select></div>';
  }
  if (mgr) btns += '<button class="btn sec sm" style="margin-top:8px" data-a="hist" data-id="' + h(o.id) + '">History</button>';
  return '<div class="card"><div class="row"><b>' + h(o.id) + '</b><span style="text-align:right"><span class="badge b-' + h(sc) + '">' + h(o.status) + '</span>' + (o.late ? ' <span class="badge b-late">earlier day</span>' : '') + '</span></div>' +
    '<div><b>' + h(o.name) + '</b> · <a href="tel:' + h(String(o.phone).replace(/\s/g, '')) + '">' + h(o.phone || 'no phone') + '</a></div>' +
    '<div>' + h(o.address) + '</div>' + (nav ? '<a class="btn sec" style="display:block;text-align:center;text-decoration:none;line-height:28px" target="_blank" rel="noopener" href="' + h(nav) + '">Navigate</a>' : '<div class="mute">No clear location: call the customer.</div>') +
    '<ul class="items">' + items.map(i => '<li>' + h(i) + '</li>').join('') + '</ul>' +
    '<div class="mute">' + (o.fish ? h(o.fish) + ' · ' : '') + '₹' + h(o.total) + ' · ' + h(o.pay) + ' ' + h(o.paid) + '</div>' +
    (cod ? '<div style="color:var(--red);font-weight:600">Collect ₹' + h(o.total) + ' (COD)</div>' : '') +
    (o.remarks ? '<div class="mute">Note: ' + h(o.remarks) + '</div>' : '') + (o.reason ? '<div class="mute">Reason: ' + h(o.reason) + '</div>' : '') +
    (mgr ? '<div class="mute">Rider: ' + h(o.assignedName || 'not assigned') + '</div>' : '') + btns + '</div>';
}
function ordersBlock() {
  if (!S.orders) return '<div class="card mute">Loading orders...</div>';
  let l = S.orders;
  if (S.filter === 'MINE') l = l.filter(o => o.assignedTo === S.user.id);
  if (S.filter === 'UN') l = l.filter(o => !o.assignedTo);
  return (l.length ? l.map(orderCard).join('') : '<div class="card mute">No orders to show.</div>');
}
function kpis() {
  const o = S.orders || [], c = f => o.filter(f).length;
  const k = [['Total', o.length], ['Not assigned', c(x => !x.assignedTo && x.status === 'Pending')], ['Assigned', c(x => x.status === 'Assigned')],
    ['Out', c(x => x.status === 'Out for Delivery')], ['Delivered', c(x => x.status === 'Delivered')], ['Failed', c(x => x.status === 'Failed')]];
  return '<div class="kpis">' + k.map(x => '<div class="kpi"><b>' + x[1] + '</b><small>' + x[0] + '</small></div>').join('') + '</div>';
}
function teamTable() {
  if (!S.team) return '<div class="card mute">Loading...</div>';
  return '<div class="card tbl"><table><tr><th>Name</th><th>Today</th><th>In</th><th>Out</th><th>Location</th>' + (S.tab === 'team' ? '<th></th>' : '') + '</tr>' +
    S.team.map(t => '<tr><td>' + h(t.name) + '<div class="mute">' + h(t.role) + '</div></td><td><span class="badge b-' + t.state + '">' + (t.state === 'IN' ? 'In' : t.state === 'OUT' ? 'Out' : 'Absent') + '</span></td><td>' + tm(t.inTime) + '</td><td>' + tm(t.outTime) + '</td><td>' +
      (t.loc ? mapLink(t.loc.lat, t.loc.lng) + '<div class="mute">' + t.loc.ageMin + ' min ago' + (t.loc.stale ? ' (stale)' : '') + '</div>' : '-') + '</td>' +
      (S.tab === 'team' ? '<td><button class="btn sec sm" data-a="pin" data-id="' + h(t.id) + '">Reset PIN</button></td>' : '') + '</tr>').join('') + '</table></div>';
}
function reportView() {
  const r = S.report;
  let x = '<div class="card"><h2>Month</h2><input type="month" id="mon" value="' + h(S.month) + '"></div>';
  if (!r) return x + '<div class="card mute">Loading...</div>';
  x += '<div class="card tbl"><h2>Summary</h2><table><tr><th>Name</th><th>Days</th><th>Hours</th><th>Missing out</th><th>Logins</th><th>Delivered</th><th>Failed</th></tr>' +
    r.summary.map(s => '<tr><td>' + h(s.name) + '</td><td>' + s.days + '</td><td>' + s.hours + '</td><td>' + s.missing + '</td><td>' + s.logins + '</td><td>' + s.delivered + '</td><td>' + s.failed + '</td></tr>').join('') + '</table></div>' +
    '<div class="row"><button class="btn sec" data-a="csv">Download CSV</button><button class="btn sec" data-a="mail">Email this report</button></div>' +
    '<div class="card tbl" style="margin-top:12px"><h2>Attendance details</h2>' + (r.rows.length ? '<table><tr><th>Date</th><th>Name</th><th>In</th><th>In loc</th><th>Out</th><th>Out loc</th><th>Hours</th><th>Status</th></tr>' +
    r.rows.map(a => '<tr><td>' + dm(a.date) + '</td><td>' + h(a.name) + '</td><td>' + tm(a.inTime) + '</td><td>' + mapLink(a.inLat, a.inLng) + '</td><td>' + tm(a.outTime) + '</td><td>' + mapLink(a.outLat, a.outLng) + '</td><td>' + a.hours + '</td><td>' + h(a.status) + '</td></tr>').join('') + '</table>' : '<div class="mute">No attendance this month.</div>') + '</div>' +
    '<div class="card tbl"><h2>Logins (' + r.logins.length + ')</h2>' + (r.logins.length ? '<table><tr><th>Date</th><th>Time</th><th>Staff</th></tr>' + r.logins.slice(0, 100).map(l => '<tr><td>' + dm(l.time) + '</td><td>' + tm(l.time) + '</td><td>' + h((r.summary.find(s => s.id === l.id) || {}).name || l.id) + '</td></tr>').join('') + '</table>' : '<div class="mute">No logins.</div>') + '</div>';
  return x;
}
function csvDownload() {
  const r = S.report, c = v => { let s = String(v == null ? '' : v); if (/^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  const rows = [['Date', 'Staff ID', 'Name', 'Role', 'Check-in', 'In Lat', 'In Lng', 'Check-out', 'Out Lat', 'Out Lng', 'Hours', 'Status']].concat(r.rows.map(a => [a.date, a.id, a.name, a.role, a.inTime, a.inLat, a.inLng, a.outTime, a.outLat, a.outLng, a.hours, a.status]));
  const el = document.createElement('a'); el.href = URL.createObjectURL(new Blob([rows.map(x => x.map(c).join(',')).join('\n')], { type: 'text/csv' }));
  el.download = 'TruSea_Attendance_' + r.month + '.csv'; el.click();
}

function render() {
  const app = $('#app'), msg = S.msg ? '<div class="msg' + (S.msg.err ? ' err' : '') + '">' + h(S.msg.t) + '</div>' : '';
  if (S.loc.ok === null) { app.innerHTML = '<div class="gate"><h2>TruSea Ops</h2><p class="mute">Checking location...</p></div>'; return; }
  if (S.loc.ok === false) {
    app.innerHTML = '<div class="gate"><h2>Location is OFF</h2><p>' + h(S.loc.msg) + '</p><p class="mute">This app works only when phone location is ON.</p><button class="btn" data-a="retry">Retry</button></div>'; return;
  }
  if (!S.user) {
    if (!S.staffList) { app.innerHTML = '<div class="gate"><h2>TruSea Ops</h2><p class="mute">Loading...</p></div>'; return; }
    app.innerHTML = '<div class="wrap" style="max-width:420px"><h2 style="font-size:22px;margin-top:24px">TruSea Ops</h2>' + msg + '<div class="card"><label class="mute">Name</label><select id="lid"><option value="">Select...</option>' +
      S.staffList.map(s => '<option value="' + h(s.id) + '">' + h(s.name) + '</option>').join('') + '</select><label class="mute" style="display:block;margin-top:10px">PIN</label><input id="lpin" type="password" inputmode="numeric" autocomplete="off">' +
      '<button class="btn" data-a="login"' + (S.busy ? ' disabled' : '') + '>Login</button></div></div>'; return;
  }
  const mgr = S.user.manager;
  let body = '';
  if (mgr) {
    if (S.tab === 'today') body = attCard() + kpis() + (S.noDate ? '<div class="card mute">' + S.noDate + ' confirmed order(s) have no Expected Delivery Date.</div>' : '') + '<h2>Staff today</h2>' + teamTable();
    else if (S.tab === 'deliveries') body = '<div class="row"><input type="date" id="dsel" value="' + h(S.date) + '"><select id="flt"><option value="ALL"' + (S.filter === 'ALL' ? ' selected' : '') + '>All</option><option value="UN"' + (S.filter === 'UN' ? ' selected' : '') + '>Unassigned</option><option value="MINE"' + (S.filter === 'MINE' ? ' selected' : '') + '>Mine</option></select><button class="btn sec sm" data-a="ref">Refresh</button></div><div style="height:10px"></div>' + ordersBlock();
    else if (S.tab === 'team') body = teamTable();
    else body = reportView();
  } else {
    body = attCard() + (S.user.canDeliver ? '<div class="row" style="margin-bottom:8px"><h2 style="margin:0">My deliveries today</h2><button class="btn sec sm" data-a="ref" style="flex:0">Refresh</button></div>' + ordersBlock() : '') +
      '<div class="card tbl"><h2>This month</h2>' + (S.myMonth && S.myMonth.length ? '<table><tr><th>Date</th><th>In</th><th>Out</th><th>Hours</th></tr>' + S.myMonth.map(a => '<tr><td>' + dm(a.date) + '</td><td>' + tm(a.inTime) + '</td><td>' + tm(a.outTime) + '</td><td>' + a.hours + '</td></tr>').join('') + '</table>' : '<div class="mute">No records yet.</div>') + '</div>';
  }
  const tabs = mgr ? '<div class="tabs">' + [['today', 'Today'], ['deliveries', 'Deliveries'], ['team', 'Team'], ['reports', 'Reports']].map(t => '<button data-a="tab" data-t="' + t[0] + '" class="' + (S.tab === t[0] ? 'on' : '') + '">' + t[1] + '</button>').join('') + '</div>' : '';
  app.innerHTML = '<div class="top"><div><b>' + h(S.user.name) + '</b><small>' + h(S.user.role) + '</small></div><button class="btn sec sm" data-a="logout">Logout</button></div>' + tabs +
    '<div class="wrap">' + msg + (S.error ? '<div class="msg err">' + h(S.error) + ' <a href="#" data-a="ref">Retry</a></div>' : '') + body + '</div>';
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-a]'); if (!t) return;
  const a = t.dataset.a, id = t.dataset.id;
  if (a === 'retry') { S.loc.ok = null; render(); await checkLoc(); if (S.loc.ok === null) render(); }
  else if (a === 'login') doLogin();
  else if (a === 'logout') logout();
  else if (a === 'in') attendanceAction('checkIn');
  else if (a === 'out') attendanceAction('checkOut');
  else if (a === 'st') setStatus(id, t.dataset.s);
  else if (a === 'tab') { S.tab = t.dataset.t; S.error = ''; render(); refresh().catch(x => { S.error = x.message; render(); }); }
  else if (a === 'ref') { e.preventDefault(); refresh().catch(x => { S.error = x.message; render(); }); }
  else if (a === 'csv') csvDownload();
  else if (a === 'mail') run(async () => { const j = await api('emailReport', { month: S.month }); toast('Sent to ' + j.to); });
  else if (a === 'pin') { if (await dialog('Reset PIN?', 'A new PIN will be created. The old one stops working.', false, 'Reset')) run(async () => { const j = await api('resetPin', { staffId: id }); await dialog('New PIN for ' + j.name, '<b style="font-size:24px">' + h(j.pin) + '</b><br>Note it now. It is shown only once.', false, 'Done'); }); }
  else if (a === 'hist') { try { const j = await api('history', { orderId: id }); await dialog('History ' + id, j.rows.length ? j.rows.map(r => dm(r.time) + ' ' + tm(r.time) + ' · ' + h(r.by) + ' · ' + h(r.action) + ' · ' + h(r.details)).join('<br>') : 'No history yet.', false, 'Close'); } catch (x) { toast(x.message, true); } }
});
document.addEventListener('change', e => {
  const t = e.target, a = t.dataset.a;
  if (a === 'asg' && t.value) assign(t.dataset.id, t.value === '-' ? '' : t.value);
  else if (a === 'ovr' && t.value) setStatus(t.dataset.id, t.value);
  else if (t.id === 'dsel') { S.date = t.value || today(); S.orders = null; render(); refresh().catch(x => { S.error = x.message; render(); }); }
  else if (t.id === 'flt') { S.filter = t.value; render(); }
  else if (t.id === 'mon') { S.month = t.value || today().slice(0, 7); S.report = null; render(); refresh().catch(x => { S.error = x.message; render(); }); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) { S.user ? tick() : checkLoc(); } });
if (navigator.permissions && navigator.permissions.query) navigator.permissions.query({ name: 'geolocation' }).then(p => { p.onchange = () => checkLoc(); }).catch(() => {});

(async function init() {
  render();
  await checkLoc();
  render();
  try { S.staffList = (await api('staffList')).staff; } catch (e) { S.msg = { t: 'Cannot reach server: ' + e.message, err: true }; S.staffList = []; }
  render();
  startTimer();
})();
</script>
</body>
</html>
